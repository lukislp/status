name: Check

# Probes every component, folds the result into data/ and - when something visible changed, or
# at most every `publish_interval_minutes` - commits data/ through the lktec-bot GitHub App
# (module sync, docs/modules/sync.md in lukislp/lktec-bot; GitHub signs that commit) and
# redeploys the page. Runs in between only carry their results forward through the Actions
# cache, so the repository gets a few dozen small commits a day instead of one every five minutes.
#
# GitHub runs scheduled workflows late under load; gaps of 10-20 minutes are normal and only
# mean fewer samples, never a false outage.
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

concurrency:
  group: status-check
  cancel-in-progress: false

permissions:
  contents: read
  actions: read # the reusable sync workflow reads which commit of itself the run uses

jobs:
  check:
    if: github.repository == 'lukislp/status'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: read
    outputs:
      publish: ${{ steps.check.outputs.publish }}
      base: ${{ steps.base.outputs.sha }}
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          # audit, not block: the probed hosts come from config.json, and a blocked probe would
          # be published as an outage.
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false
      - name: Restore the unpublished state of earlier runs
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .state-cache
          key: status-data-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: status-data-
      - name: Probe components
        id: check
        run: python3 -m statuspage check --cache .state-cache
      - name: Keep this run's state for the next run
        run: |
          rm -rf .state-cache
          cp -r data .state-cache
      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .state-cache
          key: status-data-${{ github.run_id }}-${{ github.run_attempt }}
      # The commit itself is made by the sync job below (lktec-bot App). This step only hands the
      # changed files of data/ over as an artifact: manifest.txt plus files/<path>, the layout the
      # sync workflow expects. Deletions are not handed over; data/ only ever grows.
      - id: base
        if: steps.check.outputs.publish == 'true'
        name: Hand the changed data files over to the sync job
        run: |
          set -eu
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          handover="$RUNNER_TEMP/handover"
          mkdir -p "$handover/files"
          : > "$handover/manifest.txt"
          while IFS= read -r -d '' path; do
            mkdir -p "$handover/files/$(dirname "$path")"
            cp "$path" "$handover/files/$path"
            printf '%s\n' "$path" >> "$handover/manifest.txt"
            echo "changed: $path"
          done < <(git ls-files -z --modified --others --exclude-standard -- data)
      - if: steps.check.outputs.publish == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: status-handover
          path: ${{ runner.temp }}/handover
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1
      - name: Read incidents and maintenance from issues
        if: steps.check.outputs.publish == 'true'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 -m statuspage fetch-issues --out .issues.json
      - name: Build the site
        if: steps.check.outputs.publish == 'true'
        run: python3 -m statuspage build --issues .issues.json --out _site
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        if: steps.check.outputs.publish == 'true'
        with:
          path: _site

  # Commits the handed-over data/ files onto main as lktec-bot[bot] (the App is a bypass actor of
  # the branch ruleset for this; the policy in .github/lktec-bot.yml limits it to data/).
  sync:
    needs: check
    if: needs.check.outputs.publish == 'true'
    uses: lukislp/lktec-bot/.github/workflows/sync.yml@d2e0693df66fa10167181e6c3844cdc2032f4399 # v0.7.2
    with:
      artifact: status-handover
      branch: main
      base-sha: ${{ needs.check.outputs.base }}
    secrets:
      app-id: ${{ secrets.LKTEC_BOT_APP_ID }}
      private-key: ${{ secrets.LKTEC_BOT_PRIVATE_KEY }}

  deploy:
    needs: check
    if: needs.check.outputs.publish == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: pages
      cancel-in-progress: false
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
