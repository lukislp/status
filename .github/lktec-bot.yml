# Policy of the lktec-bot GitHub App for this repository. Committed to the default branch: the
# bot reads it from there, never from a pull request. See docs/modules/automerge.md in
# lukislp/lktec-bot for every key.
version: 1
modules:
  automerge:
    enabled: true
    # patch, minor and digest updates are armed; manual leaves majors to a person.
    majors: manual
    # auto arms a pull request that changes .github/workflows/; manual leaves it to a person.
    workflow-files: auto
    # How GitHub merges once the checks are green.
    method: squash
    # Merge a pull request GitHub refuses to arm because it is already mergeable (merge verb,
    # lktec-bot v0.9.0): only that case, bound to the approved head, never an admin merge.
    merge-ready: true
    # Dependency names (exact, case-insensitive) that are never approved or armed.
    exclude: []

  # Commits the generated status data onto main every few minutes (see docs/modules/sync.md in
  # lukislp/lktec-bot). The App is a bypass actor of the branch ruleset for it.
  sync:
    enabled: true
    paths: [data]
    branch: main
    commit-message: "chore(data): status update [skip ci]"
